spring.application.name=polizasapi
server.port=8080

# Base de datos en memoria (se carga con data.sql al iniciar)
spring.datasource.url=jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seguridad: valor esperado en el header x-api-key
api.key=123456

# Integracion con CORE transaccional (mock expuesto por la misma API)
core.url=http://localhost:${server.port}/core-mock/eventos
