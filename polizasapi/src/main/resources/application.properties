spring.application.name=polizasapi
# Render (y otras plataformas) asignan el puerto en la variable PORT
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Base de datos en memoria (se carga con data.sql al iniciar)
spring.datasource.url=jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# La consola de H2 es solo para desarrollo; en Render se apaga con H2_CONSOLE_ENABLED=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Health check publico (sin API key) para la plataforma de despliegue
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Documentacion OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true

# Seguridad: valor esperado en el header x-api-key (se puede cambiar con la variable API_KEY)
api.key=${API_KEY:123456}

# Integracion con CORE transaccional (mock expuesto por la misma API)
core.url=http://localhost:${server.port}/core-mock/eventos
