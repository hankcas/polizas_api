[pytest]
# Para que `import app...` funcione al correr pytest desde la carpeta agente/.
pythonpath = .
testpaths = tests
# Las pruebas marcadas "lento" usan el modelo real de embeddings (se descarga ~220 MB).
# Se saltan por defecto; para correrlas: pytest -m lento
addopts = -m "not lento"
markers =
    lento: usa el modelo real de embeddings (requiere descargarlo)
